<!DOCTYPE html>
<html lang="es" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo List</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body class="min-h-screen bg-indigo-300 dark:bg-gray-700 transition-colors duration-300">

  <div class="max-w-2xl mx-auto px-4 py-10">

  <!--header-->
    <div class="flex items-center justify-between mb-8">
      <h1 class="text-3xl font-bold text-white-900 dark:text-blue-100">
       To do List
      </h1>
      <button id="btnDark"
        class="bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-white px-4 py-2 rounded-lg text-sm font-semibold hover:opacity-80 transition">
        Dark Mode
      </button>
    </div>

    <!--añadir -->
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow p-6 mb-6">
      <div class="flex gap-3">
        <input id="inputTask" type="text" placeholder="Write your new task..."
          class="flex-1 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-cyan-400" />
        <button id="btnAdd"
          class="bg-blue-900 dark:bg-cyan-600 text-white px-6 py-2 rounded-lg font-semibold hover:opacity-80 transition">
          Add
        </button>
      </div>
    </div>

    <!--Seccion de todas, añadir y task completado-->
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow p-4 mb-6 flex flex-col gap-3">
      <input id="inputFind" type="text" placeholder="Find "
        class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-cyan-400" />
      <div class="flex gap-2">
        <button data-filtro="All"
          class="filtro-btn flex-1 py-2 rounded-lg text-sm font-semibold bg-blue-900 text-white">
          All
        </button>
        <button data-filtro="For doing "
          class="filtro-btn flex-1 py-2 rounded-lg text-sm font-semibold bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-white">
          For Doing
        </button>
        <button data-filtro="Completed"
          class="filtro-btn flex-1 py-2 rounded-lg text-sm font-semibold bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-white">
          Completed
        </button>
      </div>
    </div>

    
    <div id="list_of_task" class="flex flex-col gap-3">
   
    </div>

    
    <p id="counter" class="text-center text-gray-400 dark:text-gray-500 text-sm mt-6"></p>

  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
